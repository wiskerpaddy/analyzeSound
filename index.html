<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="./manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instrument Analyzer Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="compare-mode">
    <div class="container">
        <!-- モード切替 -->
        <div class="mode-selector">
            <button id="modeCompare" class="mode-btn">比較モード (Compare)</button>
            <button id="modeInspect" class="mode-btn">検査モード (Inspect)</button>
        </div>

        <!-- 手順ガイド -->
        <div class="guide-box" id="guide">
            <span class="guide-title">📋 手順ガイド</span>
            <div id="guideText">AとB、それぞれの楽器で同じフレーズを録音してください。</div>
        </div>

        <div id="status" class="status-indicator">STANDBY</div>

        <!-- メインキャンバス -->
        <div class="canvas-container">
            <div id="overlay">3</div>
            <canvas id="visualizer"></canvas>
        </div>

        <!-- 操作パネル -->
        <div class="control-panel">
            <div class="rec-group">
                <button id="recA" class="btn-rec">Snapshot A 録音</button>
                <button id="recB" class="btn-rec">Snapshot B 録音</button>
            </div>
            <button id="actionBtn" class="btn-main">解析を実行</button>
            <button id="resetBtn" class="btn-reset">データを消去してリセット</button>
        </div>

        <!-- 結果表示エリア -->
        <div id="resultArea"></div>
    </div>
    <script src="script.js"></script>
    <script>
        // サービスワーカー（sw.js）をブラウザに登録する
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker registered!'))
                .catch(err => console.error('Service Worker failed:', err));
            });
        }
    </script>
</body>
</html>
