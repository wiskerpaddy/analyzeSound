<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Instrument Analyzer Pro</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --color-a: #3498db;
            --color-b: #e74c3c;
            --accent: #f1c40f;
            --recording: #c0392b;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: white; margin: 0; padding: 15px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        h1 { font-size: 1.5rem; text-align: center; margin-bottom: 10px; }
        .status { color: var(--accent); font-size: 13px; text-align: center; margin-bottom: 10px; height: 1.2em; font-weight: bold; }

        .canvas-container { position: relative; background: #000; border-radius: 10px; padding: 20px 10px 30px 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); overflow: hidden; }
        canvas { width: 100%; height: 250px; display: block; }
        
        .axis-label { position: absolute; font-size: 10px; color: #888; pointer-events: none; }
        .y-label { left: 5px; transform: translateY(-50%); }
        .x-label { bottom: 5px; transform: translateX(-50%); }

        #progress-container { width: 100%; background: #333; height: 8px; border-radius: 4px; margin: 10px 0; overflow: hidden; display: none; }
        #progress-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.1s linear; }

        .panel { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 15px 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn-a { background: var(--color-a); color: white; }
        .btn-b { background: var(--color-b); color: white; }
        .btn-analyze { background: var(--accent); color: black; grid-column: span 2; font-size: 18px; margin-top: 5px; }
        .btn-reset { background: #444; color: #ccc; grid-column: span 2; }

        @media (max-width: 768px) {
            .panel { grid-template-columns: 1fr; }
            .btn-a, .btn-b { padding: 20px 10px; font-size: 16px; }
            canvas { height: 200px; }
        }

        .is-recording { background: white !important; color: var(--recording) !important; animation: blink 0.8s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        #result-display { margin-top: 20px; }
        .result-card { background: linear-gradient(145deg, #2c3e50, #000); border: 2px solid var(--accent); padding: 20px; border-radius: 15px; animation: fadeIn 0.5s; }
        .result-title { color: var(--accent); font-size: 20px; margin: 0 0 10px 0; border-bottom: 1px solid #444; padding-bottom: 5px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <h1>Universal Instrument Analyzer</h1>
    <div class="status" id="status-msg">マイクを許可して開始</div>
    
    <div class="canvas-container">
        <div class="axis-label y-label" style="top: 10%;">High</div>
        <div class="axis-label y-label" style="top: 50%;">Mid</div>
        <div class="axis-label y-label" style="top: 90%;">Low</div>
        
        <canvas id="visualizer"></canvas>

        <div class="axis-label x-label" style="left: 0%;">0Hz</div>
        <div class="axis-label x-label" style="left: 25%;">1kHz</div>
        <div class="axis-label x-label" style="left: 50%;">2kHz</div>
        <div class="axis-label x-label" style="left: 75%;">3kHz</div>
        <div class="axis-label x-label" style="left: 100%;">4kHz</div>
    </div>

    <div id="progress-container"><div id="progress-bar"></div></div>

    <div class="panel">
        <button id="recordA" class="btn-a" data-original="Snapshot A を録音">Snapshot A を録音</button>
        <button id="recordB" class="btn-b" data-original="Snapshot B を録音">Snapshot B を録音</button>
        <button id="analyze" class="btn-analyze">🔮 比較診断を実行</button>
        <button id="reset" class="btn-reset">リセット</button>
    </div>

    <div id="result-display"></div>
</div>

<script>
    let audioCtx, analyser, dataArray;
    let snapshotA = null, snapshotB = null;
    let isRecordingNow = false;

    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    const statusMsg = document.getElementById('status-msg');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');

    async function setupAudio() {
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const source = audioCtx.createMediaStreamSource(stream);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            source.connect(analyser);
            draw();
            statusMsg.innerText = "準備完了";
        } catch (e) { statusMsg.innerText = "マイクの使用を許可してください"; }
    }

    async function captureSnapshot(target, btnId) {
        if (!audioCtx) await setupAudio();
        const btn = document.getElementById(btnId);
        const originalText = btn.getAttribute('data-original');
        
        isRecordingNow = true;
        btn.classList.add('is-recording');
        btn.innerText = "● 録音中...";
        progressContainer.style.display = 'block';
        
        let samples = [];
        const maxSamples = 60;

        const timer = setInterval(() => {
            analyser.getByteFrequencyData(dataArray);
            samples.push(new Uint8Array(dataArray));
            progressBar.style.width = (samples.length / maxSamples * 100) + '%';

            if (samples.length >= maxSamples) {
                clearInterval(timer);
                const avg = new Float32Array(analyser.frequencyBinCount);
                for (let i = 0; i < analyser.frequencyBinCount; i++) {
                    avg[i] = samples.reduce((sum, s) => sum + s[i], 0) / maxSamples;
                }
                if (target === 'A') snapshotA = avg;
                else snapshotB = avg;

                isRecordingNow = false;
                btn.classList.remove('is-recording');
                btn.innerText = originalText + " (保存済)";
                progressContainer.style.display = 'none';
                statusMsg.innerText = (snapshotA && snapshotB) ? "比較の準備が整いました" : `Snapshot ${target} 完了`;
            }
        }, 50);
    }

    function draw() {
        requestAnimationFrame(draw);
        analyser.getByteFrequencyData(dataArray);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 背景グリッド描画
        ctx.strokeStyle = "#222";
        ctx.lineWidth = 1;
        for(let i=0; i<=4; i++) {
            let x = canvas.width * (i/4);
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            let y = canvas.height * (i/4);
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        // 保存されたデータの描画
        if (snapshotA) drawGraph(snapshotA, 'rgba(52, 152, 219, 0.8)', 3);
        if (snapshotB) drawGraph(snapshotB, 'rgba(231, 76, 60, 0.8)', 3);

        // 【修正点】録音中、または片方の録音しか終わっていない時だけリアルタイム波形を表示
        if (isRecordingNow || (!snapshotA || !snapshotB)) {
            drawGraph(dataArray, 'rgba(255, 255, 255, 0.4)', 1);
        }
    }

    function drawGraph(data, color, width) {
        ctx.strokeStyle = color; ctx.lineWidth = width;
        ctx.beginPath();
        const displayLimit = data.length / 4; 
        const sliceWidth = canvas.width / displayLimit; 
        let x = 0;
        for (let i = 0; i < displayLimit; i++) {
            const y = canvas.height - (data[i] / 255.0 * canvas.height);
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            x += sliceWidth;
        }
        ctx.stroke();
    }

    document.getElementById('analyze').addEventListener('click', () => {
        if (!snapshotA || !snapshotB) { statusMsg.innerText = "両方の録音が必要です"; return; }
        const getSum = arr => arr.reduce((a, b) => a + b, 0);
        const pA = getSum(snapshotA); const pB = getSum(snapshotB);
        const diff = (pB - pA) / pA * 100;
        let verdict = Math.abs(diff) < 2.0 ? "音響的差異：微小" : (diff > 0 ? "B の方がエネルギー高" : "A の方がエネルギー高");
        
        document.getElementById('result-display').innerHTML = `
            <div class="result-card">
                <h2 class="result-title">比較分析レポート</h2>
                <p><strong>${verdict}</strong></p>
                <p style="font-size: 14px;">エネルギー差: ${Math.abs(diff).toFixed(1)}%</p>
                <p style="font-size: 13px; color: #bbb;">※グラフが静止しているため、波形の山の重なりを詳しく比較できます。</p>
            </div>`;
    });

    document.getElementById('recordA').addEventListener('click', () => captureSnapshot('A', 'recordA'));
    document.getElementById('recordB').addEventListener('click', () => captureSnapshot('B', 'recordB'));
    document.getElementById('reset').addEventListener('click', () => location.reload());
    window.onclick = () => { if (!audioCtx) setupAudio(); };
</script>
</body>
</html>
